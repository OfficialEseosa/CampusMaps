# One place for every library version in the project.
[versions]
agp = "9.1.0"
# 2.4.10, not 2.2.21: SceneView 4.38.0 is compiled with Kotlin 2.4 metadata (see docs/14, integration bump).
kotlin = "2.4.10"
coreKtx = "1.17.0"
activityCompose = "1.12.4"
lifecycle = "2.10.0"
# Launch splash (ui/splash): system splash on Ink, then the Compose animation.
coreSplashscreen = "1.2.0"
composeBom = "2026.04.01"
materialIconsExtended = "1.7.8"
datastore = "1.2.1"
coroutines = "1.10.2"
serialization = "1.9.0"
camerax = "1.6.2"
arcore = "1.56.0"
# World-locked AR layer (Raphael's ui/ar/ArGuidanceView.kt). Its ARCore dependency resolves to 1.56.0 above.
arsceneview = "4.38.0"
playServicesWearable = "19.0.0"
# Outdoor leg only: FusedLocation for the 40 m hand-off trigger, and ARCore Geospatial needs it at runtime (w1/geo).
playServicesLocation = "21.4.0"
# Explore map (leg 1 of the journey): Google Maps in Compose and the fused location provider (docs/14, end).
mapsCompose = "8.2.2"
# Meta Wearables Device Access Toolkit. 0.7.0, not 0.9/1.0: the test glasses report DWA 0.7.0 (docs/06).
mwdat = "0.7.0"
wearComposeMaterial3 = "1.6.2"
wearComposeFoundation = "1.6.2"
wear = "1.3.0"
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
# Compose ui-test pulls in Espresso 3.5.0, which crashes on API 35+ (InputManager.getInstance
# was removed). Pin a newer Espresso so instrumented tests run on current emulators.
espressoCore = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
