<title>capture</title>
<script>
// Virtual clock: the capture driver advances time frame by frame, so GSAP, three.js and
// requestAnimationFrame all see a deterministic 1/fps step no matter how slow screenshots are.
(function () {
  let now = 0;
  const cbs = [];
  window.__vt = {
    now: () => now,
    step(ms) {
      now += ms;
      const list = cbs.splice(0, cbs.length);
      for (const cb of list) { try { cb(now); } catch (e) { console.error(e); } }
    },
  };
  performance.now = () => now;
  Date.now = () => 1_700_000_000_000 + now;
  window.requestAnimationFrame = (cb) => { cbs.push(cb); return cbs.length; };
  window.cancelAnimationFrame = () => {};
})();
</script>
