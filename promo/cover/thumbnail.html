<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CampusMaps thumbnail</title>
<style>
@font-face{font-family:Sora;src:url(sora_medium.ttf);font-weight:500}
@font-face{font-family:Sora;src:url(sora_semibold.ttf);font-weight:600}
@font-face{font-family:Sora;src:url(sora_bold.ttf);font-weight:700}
@font-face{font-family:Sora;src:url(sora_extrabold.ttf);font-weight:800}
html,body{margin:0;background:#1b1614}
.t{position:relative;width:2560px;height:1440px;overflow:hidden;font-family:Sora,sans-serif;color:#fff8f4;
  background:radial-gradient(1300px 1000px at 76% 45%,rgba(198,124,78,.34),rgba(198,124,78,0) 70%),#1b1614}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(900px 700px at 72% 50%,#000 30%,transparent 100%)}
.building{position:absolute;right:120px;top:120px;width:1350px;opacity:.55;filter:drop-shadow(0 40px 80px rgba(0,0,0,.6))}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(27,22,20,.92) 0%,rgba(27,22,20,.55) 45%,rgba(27,22,20,0) 65%)}
.brand{position:absolute;left:110px;top:90px;display:flex;align-items:center;gap:26px}
.brand img{width:110px;display:block}
.brand b{font-size:64px;font-weight:800;letter-spacing:-.03em}
.brand .gold{margin-left:14px;font-size:34px;font-weight:700;color:#1b1614;background:#ffd166;border-radius:14px;padding:10px 22px;letter-spacing:.02em}
.hook{position:absolute;left:104px;top:330px;margin:0;font-weight:800;font-size:200px;line-height:.98;letter-spacing:-.04em;color:#fff;
  text-shadow:0 10px 0 rgba(0,0,0,.55),0 18px 60px rgba(0,0,0,.85)}
.sub{position:absolute;left:110px;top:780px;margin:0;font-size:96px;font-weight:700;color:#ffb68c;letter-spacing:-.02em;
  text-shadow:0 6px 0 rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.8)}
.chips{position:absolute;left:110px;bottom:120px;display:flex;gap:22px}
.chips span{border-radius:999px;padding:20px 38px;font-size:48px;font-weight:700;color:#fff;background:rgba(198,124,78,.9);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.chips span.alt{background:#fff8f4;color:#1b1614}
.phone{position:absolute;right:40px;top:140px;height:1050px;aspect-ratio:1080/2260;box-sizing:border-box;border-radius:90px;border:6px solid rgba(255,255,255,.18);
  overflow:hidden;background:#000;transform:rotate(6deg);transform-origin:50% 50%;
  box-shadow:0 60px 120px rgba(0,0,0,.75),0 0 0 14px #0d0a09}
.phone img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>
<div class="t">
  <div class="grid"></div>
  <img class="building" src="building.png" alt="">
  <div class="fade"></div>
  <div class="phone"><img src="phone-frame.png" alt=""></div>
  <div class="brand"><img src="mark.png" alt=""><b>CampusMaps</b><span class="gold">HackGT 13</span></div>
  <h1 class="hook">MAPS STOP<br>AT THE DOOR.</h1>
  <p class="sub">We walk you to the room.</p>
  <div class="chips"><span>Ray-Ban Meta glasses</span><span>Galaxy Watch</span><span class="alt">Offline</span></div>
</div>
</body>
</html>
